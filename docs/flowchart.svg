   <g id="text_1">
    <text style="fill: #ffffff; font: 700 28px 'DejaVu Sans'; text-anchor: start" x="37.89" y="37.692" transform="rotate(-0 37.89 37.692)">Claim! architecture</text>
   </g>
   <g id="text_2">
    <text style="fill: #79ddce; font: 16px 'DejaVu Sans'; text-anchor: start" x="37.89" y="65.412" transform="rotate(-0 37.89 65.412)">One final model for the claim form and rule-based PDF intake</text>
   </g>
   <g id="text_3">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="164.835" y="128.763508" transform="rotate(-0 164.835 128.763508)">Historical claims / fixed splits</text>
   </g>
   <g id="text_4">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(69.748594 152.233573)">Train 9,251 / val 3,084 / test 3,084</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(67.053594 167.058652)">19 inputs; synthetic fields excluded</text>
   </g>
   <g id="text_5">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="477.315" y="128.712726" transform="rotate(-0 477.315 128.712726)">Train-only fitting and selection</text>
   </g>
   <g id="text_6">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(368.7175 152.233573)">Logistic baseline and candidate models</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(368.917734 167.058652)">Validation analysis remains exploratory</text>
   </g>
   <g id="text_7">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="823.275" y="128.763508" transform="rotate(-0 823.275 128.763508)">Locked tuned XGBoost</text>
   </g>
   <g id="text_8">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(721.320469 152.080605)">xgboost_09 with fitted preprocessing</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(716.619688 167.21162)">Final test evaluated after model freeze</text>
   </g>
   <g id="text_9">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="164.835" y="261.375988" transform="rotate(-0 164.835 261.375988)">Claim! intake</text>
   </g>
   <g id="text_10">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(76.700078 288.338773)">Form: enter the 19 source fields</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(42.070703 303.163852)">PDF: pypdf text + rule-based field extraction</text>
   </g>
   <g id="text_11">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="477.315" y="261.375988" transform="rotate(-0 477.315 261.375988)">FastAPI / Docker / LinuxONE</text>
   </g>
   <g id="text_12">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(391.219375 288.338773)">POST /score and POST /analyze</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(358.564844 303.163852)">PDF facts feed the same final-model scorer</text>
   </g>
   <g id="text_13">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="823.275" y="261.375988" transform="rotate(-0 823.275 261.375988)">explain.score()</text>
   </g>
   <g id="text_14">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(708.238203 288.338773)">Fitted preprocessing + XGBoost inference</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(709.204141 303.163852)">Native TreeSHAP in original-field log-odds</text>
   </g>
   <g id="text_15">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="164.835" y="403.191508" transform="rotate(-0 164.835 403.191508)">Human decision</text>
   </g>
   <g id="text_16">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(57.524844 426.661573)">Officer reviews the claim and evidence</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(57.673516 441.486652)">No automatic approval or fraud finding</text>
   </g>
   <g id="text_17">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="477.315" y="403.191508" transform="rotate(-0 477.315 403.191508)">Score, tier and reasons</text>
   </g>
   <g id="text_18">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(374.041328 426.661573)">Relative ranking; hypothetical what-if</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(368.981328 441.486652)">Provisional scores and quality warnings</text>
   </g>
   <g id="text_19">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="823.275" y="403.140726" transform="rotate(-0 823.275 403.140726)">Saved evaluation and figures</text>
   </g>
   <g id="text_20">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(701.46375 426.661573)">Frozen test: ROC / PR / confusion / TreeSHAP</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(715.811875 441.486652)">Later routing reanalysis stays separate</text>
   </g>
   <g id="text_21">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="506.61" y="540.188406" transform="rotate(-0 506.61 540.188406)">PDF and missing-field safeguards</text>
   </g>
   <g id="text_22">
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(205.222031 561.380773)">UI withholds the score until BasePolicy is known. Other missing inputs are flagged; scores remain provisional.</text>
    <text style="fill: #c6d6e6; font: 11px 'DejaVu Sans'" transform="translate(200.461953 576.205852)">Rule-based extraction is not policy verification. Scanned PDFs need manual handling; OCR is not implemented.</text>
   </g>
   <g id="text_23">
    <text style="fill: #bdcbdc; font: 12px 'DejaVu Sans'; text-anchor: start" x="43.47" y="630.9" transform="rotate(-0 43.47 630.9)">Review: 0.1754    Investigate: 0.31254968    XGBoost alone; scores are not calibrated probabilities</text>
   </g>
   <g id="text_24">
    <text style="fill: #bdcbdc; font: 11px 'DejaVu Sans'; text-anchor: start" x="43.47" y="655.848" transform="rotate(-0 43.47 655.848)">Application source reviewed at 1cea778. Latest PDF path: source-reviewed; no new live-service check performed.</text>
   </g>
  </g>
 </g>
